<div class="container min-vh-100 d-flex justify-content-center align-items-center mt-5">
  <div class="card shadow-lg p-4 form-container">
    <h2 class="text-center mb-4">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="d-grid gap-3">
      
      <!-- ✅ Email with Icon -->
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon> <!-- Email Icon Added -->
        <input matInput formControlName="email" type="email" placeholder="Enter your email" autocomplete="off">
      </mat-form-field>

      <!-- ✅ Password with Eye Icon -->
      <mat-form-field class="full-width" appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'" 
               placeholder="Enter your password" autocomplete="new-password">
        <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <!-- ✅ Submit Button (Disabled until valid input) -->
      <button mat-raised-button color="primary" class="btn btn-primary full-width" [disabled]="loginForm.invalid">
        Login
      </button>

      <!-- ✅ Register Link -->
      <div class="text-center mt-3">
        <p>New User? <a (click)="goToRegister()" class="register-link">Register Here</a></p>
      </div>

      <div class="text-center mt-3">
        <p>New User? <a (click)="goToForgotPassword()" class="register-link">Forgot Password?</a></p>
      </div>

     

    </form>
  </div>
</div>
