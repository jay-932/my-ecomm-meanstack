<div class="container py-4">
  <!-- ✅ Fixed Carousel -->
  <div *ngIf="bannerImages?.length">
    <owl-carousel-o [options]="customOptions">
      <ng-container *ngFor="let item of bannerImages; let i = index; trackBy: trackByIndex">
        <ng-template carouselSlide>
          <a [routerLink]="'/product/' + item._id" class="flex flex-col items-center no-underline">
            <img [src]="item.images?.[0]" alt="Banner Image {{ i }}" class="w-full">
            <span class="text-black font-semibold text-lg mt-2 text-center w-full">
              {{ item.name }}
            </span>
          </a>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>

  <!-- ✅ Featured Products Section -->
  <h4 class="section-title">Featured Products</h4>
  <div class="row">
    <div class="col-md-4" *ngFor="let product of featuredProducts">
      <a [routerLink]="'/product/' + product._id" class="no-underline">
        <app-product-card [product]="product"></app-product-card>
      </a>
    </div>
  </div>

  <!-- ✅ New Products Section -->
  <h4 class="section-title">New Products</h4>
  <div class="row">
    <div class="col-md-4" *ngFor="let product of newProducts">
      <a [routerLink]="'/product/' + product._id" class="no-underline">
        <app-product-card [product]="product"></app-product-card>
      </a>
    </div>
  </div>
</div>
